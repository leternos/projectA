[project]
name = "analogico-backend"
version = "0.1.0"
description = "Backend Python do sub-projeto analogico"
requires-python = ">=3.11"
dependencies = [
    "pymupdf>=1.24",
    "jsonschema>=4.21",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
